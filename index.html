<!-- Valentine Surprise - Main photo (photo0.jpg) + Gallery (photo1.jpg ... photo10.jpg) -->
<!-- Instructions:
1. Create a GitHub repository (e.g., valentine-for-divya)
2. Upload this file as index.html
3. Add your images as photo0.jpg, photo1.jpg, ... photo10.jpg in the same folder.
4. Click Settings → Pages → Deploy from branch → main → /(root) → Save
5. Wait for your live link to appear under GitHub Pages section.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Valentine, Divya? 💖</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(to bottom, #ffe4e6, #fff); }
    .fade-in { animation: fadeIn 1.5s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .photo-gallery img { transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .photo-gallery img:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-5xl w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="flex flex-col items-center justify-center gap-4">
      <h2 class="text-3xl font-semibold fade-in text-center">A little surprise for Divya 💌</h2>
      <p class="text-sm text-gray-600 text-center px-4 fade-in">Click the heart when you're ready, एउटा कुरा सोध्छु है.</p>
      <button id="askBtn" class="mt-2 inline-flex items-center gap-2 px-5 py-3 rounded-full bg-pink-500 text-white font-medium shadow hover:scale-[1.02] active:scale-95 transition fade-in">❤️ Ask Divya</button>
      <p id="response" class="mt-4 text-center font-semibold"></p>

      <div class="photo-gallery grid grid-cols-2 sm:grid-cols-3 gap-3 mt-6">
        <!-- 10 small images -->
        <img src="photo1.jpg" alt="photo1" class="rounded-xl object-cover w-40 h-40">
        <img src="photo2.jpg" alt="photo2" class="rounded-xl object-cover w-40 h-40">
        <img src="photo3.jpg" alt="photo3" class="rounded-xl object-cover w-40 h-40">
        <img src="photo4.jpg" alt="photo4" class="rounded-xl object-cover w-40 h-40">
        <img src="photo5.jpg" alt="photo5" class="rounded-xl object-cover w-40 h-40">
        <img src="photo6.jpg" alt="photo6" class="rounded-xl object-cover w-40 h-40">
        <img src="photo7.jpg" alt="photo7" class="rounded-xl object-cover w-40 h-40">
        <img src="photo8.jpg" alt="photo8" class="rounded-xl object-cover w-40 h-40">
        <img src="photo9.jpg" alt="photo9" class="rounded-xl object-cover w-40 h-40">
        <img src="photo10.jpg" alt="photo10" class="rounded-xl object-cover w-40 h-40">
      </div>
    </div>

    <div class="relative flex items-center justify-center">
      <div class="absolute inset-0 rounded-xl overflow-hidden">
        <img src="photo0.jpg" alt="Main photo" class="w-full h-full object-cover brightness-90" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent" />
      </div>
      <div class="relative z-10 text-center p-6">
        <h3 class="text-white text-3xl font-bold drop-shadow">Will you be my Valentine, Divya?</h3>
        <p class="text-white/90 mt-2">Made with ❤ by Diwash. From some of our favorite memories.</p>
        <div class="mt-4 flex gap-3 justify-center">
          <button id="yesBtn" class="px-4 py-2 rounded-full bg-white/90 hover:bg-white active:scale-95 transition font-medium">Yes 💕</button>
          <button id="noBtn" class="px-4 py-2 rounded-full bg-white/70 hover:bg-white active:scale-95 transition font-medium">Not yet</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" id="closeModal"></div>
    <div class="relative z-10 max-w-md w-full bg-white rounded-2xl p-6 shadow-lg text-center">
      <h2 class="text-2xl font-bold">Hey Divya 💖</h2>
      <p class="mt-2 text-gray-600">Will you be my Valentine?</p>
      <div class="mt-5 flex gap-3 justify-center">
        <button id="modalYes" class="px-4 py-2 rounded-full bg-pink-500 text-white font-medium">Yes, of course</button>
        <button id="modalNo" class="px-4 py-2 rounded-full border border-gray-200 font-medium">Maybe later</button>
      </div>
    </div>
  </div>

  <script>
    const askBtn = document.getElementById('askBtn');
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('closeModal');
    const modalYes = document.getElementById('modalYes');
    const modalNo = document.getElementById('modalNo');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const response = document.getElementById('response');

    askBtn.addEventListener('click', () => modal.classList.remove('hidden'));
    closeModal.addEventListener('click', () => modal.classList.add('hidden'));

    modalYes.addEventListener('click', () => {
      modal.classList.add('hidden');
      response.textContent = 'She said YES! 🥳';
      response.className = 'text-green-600 font-semibold';
    });

    modalNo.addEventListener('click', () => {
      modal.classList.add('hidden');
      response.textContent = 'झुक्केर यो अप्सन थिछे जस्तो छौ, राम्ररी हेरन अप्सन्स💖';
      response.className = 'text-rose-600 font-semibold';
    });

    yesBtn.addEventListener('click', () => {
      response.textContent = 'She said YES! 🥳';
      response.className = 'text-green-600 font-semibold';
    });

    noBtn.addEventListener('click', () => {
      response.textContent = 'झुक्केर यो अप्सन थिछे जस्तो छौ, राम्ररी हेरन अप्सन्स💖';
      response.className = 'text-rose-600 font-semibold';
    });
  </script>
</body>
</html>
